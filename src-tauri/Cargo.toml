[package]
name = "zibra-desktop"
version = "2.2.0"
description = "ZibraX Native Manga & Manhwa Reader"
authors = ["ZERAVRIX Team <contact@zeravrix.org>"]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
tauri = { version = "2.12.5", features = ["custom-protocol"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
anyhow = { workspace = true }
parking_lot = { workspace = true }
dirs = { workspace = true }
base64 = { workspace = true }
url = { workspace = true }
log = "0.4"

zibra-core = { path = "../crates/zibra-core" }
zibra-sources = { path = "../crates/zibra-sources" }
zibra-reader = { path = "../crates/zibra-reader" }
